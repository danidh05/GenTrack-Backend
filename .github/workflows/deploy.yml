name: Deploy to AwardSpace
on:
  push:
    branches: [master]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync to AwardSpace via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: gentrack.atwebpages.com # AwardSpace gives you this
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp # use ftps if their server supports it, else ftp
          server-dir: /gentrack.atwebpages.com/ # your site root inside the FTP account
          local-dir: ./ # or ./public/ if that's what should be exposed
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            .env.*
